        return saved ? JSON.parse(saved) : fallback;
      } catch (e) {
        return fallback;
      }
    }
    function saveStorage(key, data) {
      try {
        localStorage.setItem(key, JSON.stringify(data));
      } catch (e) {}
    }

        setState({ filterStatus: st });
      },
      setAgendaType: function(type) {
        setState({ agendaType: type });
      },
      openModal: function(modalName) {
        setState({ activeModal: modalName, selectedItem: null });
      },
      closeModal: function() {
        setState({ activeModal: null, selectedItem: null });
      },
      openDisposisi: function(id) {
        const item = state.suratMasuk.find(s => s.id === id);
        if (item) setState({ activeModal: 'disposisi', selectedItem: item });
      },
      printDisposisi: function(id) {
        const item = state.suratMasuk.find(s => s.id === id);
        if (item) setState({ activeModal: 'print-disposisi', selectedItem: item });
      },
      previewSuratKeluar: function(id) {
        const item = state.suratKeluar.find(s => s.id === id);
        if (item) setState({ activeModal: 'print-keluar', selectedItem: item });
      },
      saveDisposisi: function(e, id) {
        e.preventDefault();
        const form = e.target;
        const checkedPejabat = Array.from(form.querySelectorAll('input[name="pejabat"]:checked')).map(el => el.value);
        const checkedInstruksi = Array.from(form.querySelectorAll('input[name="instruksi"]:checked')).map(el => el.value);
        const catatan = document.getElementById('disp-catatan').value;
        const deadline = document.getElementById('disp-deadline').value;
        const statusVal = document.getElementById('disp-status').value;

        const updated = state.suratMasuk.map(s => {
          if (s.id === id) {
            return {
              ...s,
              statusDisposisi: statusVal,
              disposisi: {
                tglDisposisi: new Date().toISOString().split('T')[0],
                diteruskanKepada: checkedPejabat,
                instruksi: checkedInstruksi,
                catatanKepalaSekolah: catatan,
                batasWaktu: deadline
              }
            };
          }
          return s;
        });

        setState({ suratMasuk: updated, activeModal: null });
      },
      saveSuratMasuk: function(e) {
        e.preventDefault();
        const newSurat = {
          id: 'sm-' + Date.now(),
          noAgenda: document.getElementById('sm-agenda').value,
          kodeKlasifikasi: document.getElementById('sm-klasifikasi').value,
          pengirim: document.getElementById('sm-pengirim').value,
          noSurat: document.getElementById('sm-nosurat').value,
          tglSurat: document.getElementById('sm-tglsurat').value,
          tglTerima: document.getElementById('sm-tglterima').value,
          sifat: document.getElementById('sm-sifat').value,
          perihal: document.getElementById('sm-perihal').value,
          ringkasan: document.getElementById('sm-ringkasan').value,
          lokasiArsip: document.getElementById('sm-lokasi').value,
          statusDisposisi: 'Belum Didisposisi',
          disposisi: null
        };
        setState({ suratMasuk: [newSurat, ...state.suratMasuk], activeModal: null });
      },
      saveSuratKeluar: function(e) {
        e.preventDefault();
        const newSurat = {
          id: 'sk-' + Date.now(),
          noAgenda: document.getElementById('sk-agenda').value,
          noSurat: document.getElementById('sk-nosurat').value,
          jenisSurat: document.getElementById('sk-jenis').value,
          kodeKlasifikasi: '421.3 - Kepegawaian & Ketenagaan',
          tglSurat: document.getElementById('sk-tglsurat').value,
          penerima: document.getElementById('sk-penerima').value,
          alamatPenerima: document.getElementById('sk-alamat').value,
          perihal: document.getElementById('sk-perihal').value,
          isiLengkap: document.getElementById('sk-isi').value,
          penandatangan: state.profil.namaKepalaSekolah,
          nipPenandatangan: state.profil.nipKepalaSekolah,
          status: 'Diterbitkan',
          lokasiArsip: 'Ordner SK-2026 / Lemari TU-01'
        };
        setState({ suratKeluar: [newSurat, ...state.suratKeluar], activeModal: null });
      },
      applyTemplate: function(jenis) {
        const perihalEl = document.getElementById('sk-perihal');
        const isiEl = document.getElementById('sk-isi');
        if (!perihalEl || !isiEl) return;
        if (jenis === 'Surat Undangan') {
          perihalEl.value = 'Undangan Rapat Kedinasan';
          isiEl.value = 'Dengan hormat,\nSehubungan dengan pelaksanaan agenda kedinasan sekolah, kami mengharapkan kehadiran Bapak/Ibu pada rapat koordinasi.\n\nDemikian atas perhatian dan kehadirannya diucapkan terima kasih.';
        } else if (jenis === 'Surat Keterangan Siswa') {
          perihalEl.value = 'Surat Keterangan Aktif Belajar Peserta Didik';
          isiEl.value = 'Yang bertanda tangan di bawah ini Kepala SMP Negeri 14 Tulang Bawang Barat menerangkan bahwa peserta didik tersebut adalah benar siswa aktif di SMPN 14 TBB TP 2025/2026 dan berkelakuan baik.';
        } else if (jenis === 'Surat Edaran') {
          perihalEl.value = 'Pemberitahuan Agenda Pembelajaran Sekolah';
          isiEl.value = 'Diberitahukan kepada seluruh Dewan Guru, Staf, serta Peserta Didik SMP Negeri 14 Tulang Bawang Barat mengenai penyesuaian jadwal kegiatan belajar mengajar.';
        }
      },
      saveProfil: function(e) {
        e.preventDefault();
        const updatedProfil = {
          ...state.profil,
          namaSekolah: document.getElementById('set-sekolah').value,
          npsn: document.getElementById('set-npsn').value,
          akreditasi: document.getElementById('set-akreditasi').value,
          namaKepalaSekolah: document.getElementById('set-kasek').value,
          nipKepalaSekolah: document.getElementById('set-nipkasek').value,
          namaKepalaTU: document.getElementById('set-ktu').value
        };
        setState({ profil: updatedProfil, activeModal: null });
        alert('Profil sekolah berhasil disimpan!');
      },
      deleteMasuk: function(id) {
        if (confirm('Hapus surat masuk ini?')) {
          setState({ suratMasuk: state.suratMasuk.filter(s => s.id !== id) });
        }
      },
      deleteKeluar: function(id) {
        if (confirm('Hapus surat keluar ini?')) {
          setState({ suratKeluar: state.suratKeluar.filter(s => s.id !== id) });
        }
      },
      exportCSV: function() {
        const isMasuk = state.agendaType === 'masuk';
        let csv = '';
        if (isMasuk) {
          csv = 'No,No Agenda,Tgl Terima,Pengirim,No Surat Asli,Perihal,Sifat,Disposisi\r\n';
          state.suratMasuk.forEach((s, i) => {
            csv += `"${i+1}","${s.noAgenda}","${s.tglTerima}","${s.pengirim}","${s.noSurat}","${s.perihal}","${s.sifat}","${s.disposisi?.diteruskanKepada?.join('; ') || '-'}"\r\n`;
          });
        } else {
          csv = 'No,No Agenda,No Surat Resmi,Tgl Surat,Penerima,Perihal,Status\r\n';
          state.suratKeluar.forEach((s, i) => {
            csv += `"${i+1}","${s.noAgenda}","${s.noSurat}","${s.tglSurat}","${s.penerima}","${s.perihal}","${s.status}"\r\n`;
          });
        }
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `buku_agenda_${state.agendaType}_smpn14_tubaba.csv`;
        a.click();
        URL.revokeObjectURL(url);
      },
      exportJSON: function() {
        const data = { profil: state.profil, suratMasuk: state.suratMasuk, suratKeluar: state.suratKeluar };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup_esurat_smpn14_tubaba.json`;
        a.click();
        URL.revokeObjectURL(url);
      },
      resetData: function() {
        if (confirm('Kembalikan ke data awal contoh?')) {
          localStorage.clear();
          setState({ profil: INITIAL_PROFIL, suratMasuk: INITIAL_SURAT_MASUK, suratKeluar: INITIAL_SURAT_KELUAR, activeModal: null });
        }
      }
    };

    // Initial render on load
    document.addEventListener('DOMContentLoaded', render);
    render();
  })();
  </script>
</body>
</html>
