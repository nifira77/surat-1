              dataUrl: e.target?.result,

                      <div>
                        <label className="block font-semibold mb-1">Tipe Pemohon</label>
                        <select value={formSuratIzin.tipePemohon} onChange={e => setFormSuratIzin({...formSuratIzin, tipePemohon: e.target.value})} className="w-full p-2 border rounded">
                          <option value="Siswa">Siswa</option>
                          <option value="Guru">Guru</option>
                          <option value="Staf TU">Staf TU</option>
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className="block font-semibold mb-1">Nama Lengkap *</label>
                      <input type="text" required value={formSuratIzin.nama} onChange={e => setFormSuratIzin({...formSuratIzin, nama: e.target.value})} className="w-full p-2 border rounded" />
                    </div>
                    <div>
                      <label className="block font-semibold mb-1">Alasan Permohonan Izin *</label>
                      <textarea rows={2} required value={formSuratIzin.alasan} onChange={e => setFormSuratIzin({...formSuratIzin, alasan: e.target.value})} className="w-full p-2 border rounded" />
                    </div>
                    <div className="flex justify-end gap-2 pt-2 border-t">
                      <button type="button" onClick={() => setIsAddSuratIzinOpen(false)} className="px-3 py-1.5 border rounded">Batal</button>
                      <button type="submit" className="px-4 py-1.5 bg-purple-700 text-white rounded font-semibold">Simpan Arsip Izin</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* MODAL: Upload & Kelola Berkas Digital (Surat Masuk / Keluar) */}
            {uploadModalState && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white w-full max-w-lg rounded-xl shadow-xl overflow-hidden p-6 text-xs space-y-4 max-h-[90vh] overflow-y-auto">
                  <div className="flex justify-between items-center border-b pb-2">
                    <div>
                      <h3 className="font-bold text-sm text-slate-900">
                        {uploadModalState.type === 'masuk' ? 'Berkas Digital Surat Masuk' : 'Berkas Digital Surat Keluar'}
                      </h3>
                      <p className="text-[11px] text-slate-500 font-mono">
                        {uploadModalState.surat.noSurat}
                      </p>
                    </div>
                    <button onClick={() => setUploadModalState(null)} className="text-slate-400 hover:text-black text-base">✕</button>
                  </div>

                  {/* Current Berkas or Empty */}
                  {uploadModalState.surat.berkasLampiran ? (
                    <div className="p-3.5 bg-slate-50 border border-slate-200 rounded-xl space-y-3">
                      <div className="flex items-start justify-between">
                        <div className="flex items-center gap-2">
                          <span className="text-xl">📎</span>
                          <div>
                            <p className="font-bold text-slate-800 text-xs">{uploadModalState.surat.berkasLampiran.namaFile}</p>
                            <p className="text-[11px] text-slate-500">
                              Ukuran: {uploadModalState.surat.berkasLampiran.ukuranFile} • Diunggah: {uploadModalState.surat.berkasLampiran.tanggalUpload}
                            </p>
                          </div>
                        </div>
                        <button
                          onClick={() => {
                            if (confirm('Hapus lampiran berkas ini?')) {
                              handleSaveUploadedFile(null);
                            }
                          }}
                          className="text-red-600 hover:text-red-700 text-[11px] font-medium"
                        >
                          🗑️ Hapus
                        </button>
                      </div>

                      {/* Preview if image or PDF */}
                      {uploadModalState.surat.berkasLampiran.dataUrl && (
                        <div className="pt-2 border-t border-slate-200">
                          {uploadModalState.surat.berkasLampiran.tipeFile?.includes('image') ? (
                            <img
                              src={uploadModalState.surat.berkasLampiran.dataUrl}
                              alt="Pratinjau Berkas"
                              className="max-h-56 mx-auto rounded border object-contain"
                            />
                          ) : uploadModalState.surat.berkasLampiran.tipeFile?.includes('pdf') ? (
                            <iframe
                              src={uploadModalState.surat.berkasLampiran.dataUrl}
                              title="PDF Preview"
                              className="w-full h-56 border rounded"
                            />
                          ) : null}

                          <div className="mt-2 text-center">
                            <a
                              href={uploadModalState.surat.berkasLampiran.dataUrl}
                              download={uploadModalState.surat.berkasLampiran.namaFile}
                              className="inline-block px-3 py-1 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded text-[11px]"
                            >
                              ⬇️ Unduh Berkas Digital
                            </a>
                          </div>
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="p-4 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-xs">
                      Belum ada berkas scan surat / dokumen lampiran yang diunggah untuk surat ini.
                    </div>
                  )}

                  {/* Upload new or replacement */}
                  <div className="space-y-2 pt-2 border-t border-slate-100">
                    <label className="block font-semibold text-slate-800 text-xs">
                      {uploadModalState.surat.berkasLampiran ? 'Unggah Berkas Baru / Ganti Berkas:' : 'Pilih Berkas Scan / Lampiran:'}
                    </label>
                    <input
                      type="file"
                      accept=".pdf,.jpg,.jpeg,.png,.doc,.docx"
                      onChange={(e) => {
                        if (e.target.files?.[0]) {
                          handleProcessFileSelect(e.target.files[0], (berkas) => {
                            handleSaveUploadedFile(berkas);
                          });
                        }
                      }}
                      className="w-full p-2 border rounded-lg text-xs bg-slate-50 cursor-pointer"
                    />
                    <p className="text-[10px] text-slate-400">
                      Mendukung format PDF, Gambar (JPG, PNG), Word (DOCX). Maksimal ukuran 10MB.
                    </p>
                  </div>

                  <div className="flex justify-end pt-3 border-t">
                    <button
                      onClick={() => setUploadModalState(null)}
                      className="px-4 py-1.5 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 font-medium"
                    >
                      Tutup
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MODAL PRINT DOKUMEN RESMI A4 */}
            {printState.isOpen && (
              <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-2 sm:p-4 overflow-y-auto">
                <div className="fixed top-3 left-1/2 -translate-x-1/2 z-60 bg-slate-900 text-white px-5 py-2.5 rounded-full shadow-2xl flex items-center gap-4 text-xs sm:text-sm border border-slate-700 print-hidden">
                  <span className="font-semibold text-emerald-400">🛡️ Format Resmi Kop A4</span>
                  <button
                    onClick={() => window.print()}
                    className="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-1.5 rounded-full shadow-md"
                  >
                    🖨️ Cetak Sekarang
                  </button>
                  <button
                    onClick={() => setPrintState({ isOpen: false, type: 'surat-keluar' })}
                    className="text-slate-400 hover:text-white"
                  >
                    ✕
                  </button>
                </div>

                {/* Printable Document A4 */}
                <div className="bg-white text-slate-900 w-full max-w-4xl min-h-[297mm] shadow-2xl rounded-sm p-8 sm:p-12 my-14 font-serif leading-relaxed printable-document">
                  <KopSurat profile={profile} />

                  {/* Cetak Surat Keluar */}
                  {printState.type === 'surat-keluar' && printState.suratKeluar && (
                    <div className="mt-6 space-y-5 text-[11pt]">
                      <div className="flex justify-between items-start">
                        <div className="space-y-1">
                          <div>Nomor : <span className="font-mono font-semibold">{printState.suratKeluar.noSurat}</span></div>
                          <div>Lampiran : {printState.suratKeluar.lampiran || '-'}</div>
                          <div>Perihal : <span className="font-bold underline">{printState.suratKeluar.perihal}</span></div>
                        </div>
                        <div>{profile.kotaSurat}, {formatDateIndo(printState.suratKeluar.tanggalSurat)}</div>
                      </div>
                      <div className="pt-2">
                        <p>Kepada Yth.</p>
                        <p className="font-bold">{printState.suratKeluar.tujuan}</p>
                        <p>{printState.suratKeluar.alamatTujuan || 'Di Tempat'}</p>
                      </div>
                      <p className="indent-8 text-justify">{printState.suratKeluar.pembuka}</p>
                      <div className="whitespace-pre-line pl-4 text-justify">{printState.suratKeluar.isiSurat}</div>
                      <p className="indent-8 text-justify">{printState.suratKeluar.penutup}</p>
                      
                      <div className="pt-8 flex justify-end">
                        <div className="w-80 text-center">
                          <p>{printState.suratKeluar.penandatangan === 'Kepala Sekolah' ? 'Kepala SMP Negeri 14 Tulang Bawang Barat,' : 'Kepala Tata Usaha,'}</p>
                          <div className="h-20 flex items-center justify-center italic text-2xl font-serif text-slate-800">
                            Pebriansyah
                          </div>
                          <p className="font-bold underline">{printState.suratKeluar.penandatangan === 'Kepala Sekolah' ? profile.kepalaSekolah : profile.namaTataUsaha}</p>
                          <p className="font-mono text-sm">NIP. {printState.suratKeluar.penandatangan === 'Kepala Sekolah' ? profile.nipKepalaSekolah : profile.nipTataUsaha}</p>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Cetak Lembar Disposisi */}
                  {printState.type === 'lembar-disposisi' && printState.suratMasuk && (
                    <div className="mt-6 space-y-4">
                      <div className="text-center pb-2 border-b-2 border-black">
                        <h2 className="text-base sm:text-lg font-bold uppercase font-serif">LEMBAR DISPOSISI KEPALA SEKOLAH</h2>
                        <p className="text-xs font-sans text-slate-600">Pencatatan Surat Masuk & Lembar Tindak Lanjut Kedinasan</p>
                      </div>
                      <div className="border-2 border-black text-[10.5pt] font-sans">
                        <div className="grid grid-cols-2 border-b border-black p-2">
                          <div>No. Agenda: <strong className="font-mono">{printState.suratMasuk.noAgenda}</strong></div>
                          <div>Sifat: <strong className="uppercase">{printState.suratMasuk.sifat}</strong></div>
                        </div>
                        <div className="p-2 border-b border-black">
                          <div>Asal Surat: <strong>{printState.suratMasuk.asalSurat}</strong></div>
                          <div>Nomor Surat: <span className="font-mono">{printState.suratMasuk.noSurat}</span></div>
                        </div>
                        <div className="p-2 border-b-2 border-black">
                          <div>Perihal: <strong>{printState.suratMasuk.perihal}</strong></div>
                        </div>
                        <div className="p-3 min-h-[140px] flex flex-col justify-between">
                          <div>
                            <p className="font-bold text-xs uppercase mb-1">Petunjuk / Disposisi Kepala Sekolah (PEBRIANSYAH., M.Pd):</p>
                            <p className="italic font-serif text-sm">"{printState.suratMasuk.disposisi?.isiDisposisi || 'Harap dipelajari dan ditindaklanjuti.'}"</p>
                          </div>
                          <div className="text-right pt-4">
                            <p className="text-xs">{profile.kotaSurat}, {formatDateIndo(printState.suratMasuk.tanggalDiterima)}</p>
                            <p className="font-bold underline text-sm mt-8">{profile.kepalaSekolah}</p>
                            <p className="text-xs font-mono">NIP. {profile.nipKepalaSekolah}</p>
                          </div>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Cetak Surat Izin */}
                  {printState.type === 'surat-izin' && printState.suratIzin && (
                    <div className="mt-6 space-y-5 text-[11pt]">
                      <div className="text-center pb-2">
                        <h2 className="text-base sm:text-lg font-bold uppercase font-serif underline">SURAT KETERANGAN IZIN {printState.suratIzin.tipePemohon.toUpperCase()}</h2>
                        <p className="text-xs font-mono text-slate-700">Nomor : {printState.suratIzin.noSuratIzin}</p>
                      </div>
                      <p className="indent-8 text-justify">Kepala SMP Negeri 14 Tulang Bawang Barat menerangkan bahwa:</p>
                      <div className="pl-8 space-y-1 font-sans text-[11pt]">
                        <div>Nama Lengkap : <strong>{printState.suratIzin.nama}</strong></div>
                        <div>Identitas : <span className="font-mono">{printState.suratIzin.nomorIdentitas}</span></div>
                        <div>Kelas/Jabatan : {printState.suratIzin.kelasAtauJabatan}</div>
                        <div>Jenis Izin : <strong className="text-blue-800">Izin {printState.suratIzin.jenisIzin}</strong></div>
                      </div>
                      <p className="indent-8 text-justify">
                        Diberikan izin selama <strong>{printState.suratIzin.jumlahHari} hari</strong> dengan alasan: "{printState.suratIzin.alasan}".
                      </p>
                      <div className="pt-8 flex justify-between items-end">
                        <div className="text-center w-60">
                          <p className="text-xs">Petugas Tata Usaha,</p>
                          <p className="font-bold underline text-sm mt-14">{profile.namaTataUsaha}</p>
                          <p className="text-xs font-mono">NIP. {profile.nipTataUsaha}</p>
                        </div>
                        <div className="text-center w-72">
                          <p className="text-xs">{profile.kotaSurat}, {formatDateIndo(printState.suratIzin.tanggalPengajuan)}</p>
                          <p className="text-xs font-semibold">Kepala SMPN 14 Tulang Bawang Barat</p>
                          <p className="font-bold underline text-sm mt-14">{profile.kepalaSekolah}</p>
                          <p className="text-xs font-mono">NIP. {profile.nipKepalaSekolah}</p>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Cetak Laporan Bulanan */}
                  {printState.type === 'laporan-bulanan' && printState.laporanData && (
                    <div className="mt-6 space-y-4 text-[10pt] font-sans">
                      <div className="text-center pb-2">
                        <h2 className="text-base sm:text-lg font-bold uppercase font-serif underline">LAPORAN BULANAN ADMINISTRASI PERSURATAN</h2>
                        <p className="text-xs text-slate-700">Periode: Bulan {printState.laporanData.bulan} {printState.laporanData.tahun}</p>
                      </div>
                      <table className="w-full border-collapse border border-black text-xs">
                        <thead>
                          <tr className="bg-slate-100">
                            <th className="border border-black p-1">No</th>
                            <th className="border border-black p-1">No. Surat</th>
                            <th className="border border-black p-1">Tanggal</th>
                            <th className="border border-black p-1">Pihak Terkait</th>
                            <th className="border border-black p-1">Perihal</th>
                            <th className="border border-black p-1">Status</th>
                          </tr>
                        </thead>
                        <tbody>
                          {printState.laporanData.suratMasukList.map((sm, idx) => (
                            <tr key={sm.id}>
                              <td className="border border-black p-1 text-center">{idx + 1}</td>
                              <td className="border border-black p-1 font-mono">{sm.noSurat}</td>
                              <td className="border border-black p-1">{sm.tanggalDiterima}</td>
                              <td className="border border-black p-1">{sm.asalSurat}</td>
                              <td className="border border-black p-1">{sm.perihal}</td>
                              <td className="border border-black p-1 text-center capitalize">{sm.status.replace('_', ' ')}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      <div className="pt-8 flex justify-between items-end">
                        <div className="text-center w-60">
                          <p className="text-xs">Petugas Tata Usaha,</p>
                          <p className="font-bold underline text-sm mt-14">{profile.namaTataUsaha}</p>
                          <p className="text-xs font-mono">NIP. {profile.nipTataUsaha}</p>
                        </div>
                        <div className="text-center w-72">
                          <p className="text-xs">{profile.kotaSurat}, 30 {printState.laporanData.bulan} {printState.laporanData.tahun}</p>
                          <p className="text-xs font-semibold">Mengetahui, Kepala Sekolah</p>
                          <p className="font-bold underline text-sm mt-14">{profile.kepalaSekolah}</p>
                          <p className="text-xs font-mono">NIP. {profile.nipKepalaSekolah}</p>
                        </div>
                      </div>
                    </div>
                  )}

                </div>
              </div>
            )}

          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

    <!-- Keep standard module entry for Vite bundler compatibility -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
