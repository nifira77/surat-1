      handleLogoUpload: function(event, logoKey) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        // Check if file is image
        if (!file.type.startsWith('image/')) {
          alert('Silakan pilih file gambar (PNG, JPG, SVG, WebP)!');
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            // Compress/resize image reasonably so localStorage doesn't overflow
            const canvas = document.createElement('canvas');
            const maxDim = 400; // max dimension 400px is more than enough for crisp logos
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxDim) {
                height = Math.round((height * maxDim) / width);
                width = maxDim;
              }
            } else {
              if (height > maxDim) {
                width = Math.round((width * maxDim) / height);
                height = maxDim;
              }
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Use PNG to preserve transparency
            const dataUrl = canvas.toDataURL('image/png', 0.9);
            const updatedProfil = { ...state.profil, [logoKey]: dataUrl };
            setState({ profil: updatedProfil });

            const labelNames = {
              logoAplikasi: 'Logo Aplikasi (Sidebar & Login)',
              logoKopKiri: 'Logo Kop Kiri (Pemerintah Kabupaten)',
              logoKopKanan: 'Logo Kop Kanan (Tut Wuri / Sekolah)'
            };
            alert(`${labelNames[logoKey] || 'Logo'} berhasil diperbarui!`);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      },
      setLogoFromURL: function(logoKey, url) {
        const cleanUrl = (url || '').trim();
        if (!cleanUrl) {
          alert('Silakan masukkan URL tautan gambar yang valid.');

      handleLogin: function(e) {
        if (e && e.preventDefault) e.preventDefault();
        const usernameInput = document.getElementById('login-username');
        const passwordInput = document.getElementById('login-password');
        const rememberInput = document.getElementById('login-remember');

        const rawUser = usernameInput ? usernameInput.value.trim().toLowerCase() : '';
        const rawPass = passwordInput ? passwordInput.value.trim() : '';

        if (!rawUser || !rawPass) {
          setState({ loginError: 'Silakan isi username/NIP dan kata sandi.' });
          return;
        }

        // Find user by username or NIP
        const cleanUser = rawUser.replace(/\s+/g, '');
        const found = USER_ACCOUNTS.find(u => 
          u.username.toLowerCase() === rawUser || 
          u.nip.replace(/\s+/g, '') === cleanUser
        );

        if (!found) {
          setState({ loginError: `Akun "${rawUser}" tidak ditemukan. Gunakan: kepsek, admin, agenda, atau guru.` });
          return;
        }

        if (found.password !== rawPass && rawPass !== 'password123') {
          setState({ loginError: 'Kata sandi salah. Kata sandi default adalah: password123' });
          return;
        }

        if (rememberInput && rememberInput.checked) {
          saveStorage('esurat_last_username', found.username);
        }

        // Login success
        setState({
          currentUser: found,
          loginError: '',
          lastUsername: found.username,
          activeTab: 'dashboard',
          activeModal: null
        });
      },
      quickLogin: function(roleKey) {
        const found = USER_ACCOUNTS.find(u => u.username === roleKey);
        if (found) {
          saveStorage('esurat_last_username', found.username);
          setState({
            currentUser: found,
            loginError: '',
            lastUsername: found.username,
            activeTab: 'dashboard',
            activeModal: null
          });
        }
      },
      fillDemoAccount: function(roleKey) {
        const found = USER_ACCOUNTS.find(u => u.username === roleKey) || USER_ACCOUNTS[0];
        const uInput = document.getElementById('login-username');
        const pInput = document.getElementById('login-password');
        if (uInput) uInput.value = found.username;
        if (pInput) pInput.value = found.password;
      },
      togglePasswordVisibility: function() {
        const pInput = document.getElementById('login-password');
        const btn = document.getElementById('btn-toggle-pwd');
        if (!pInput) return;
        if (pInput.type === 'password') {
          pInput.type = 'text';
          if (btn) btn.textContent = 'Sembunyi';
        } else {
          pInput.type = 'password';
          if (btn) btn.textContent = 'Lihat';
        }
      },
      logout: function() {
        setState({
          currentUser: null,
          loginError: '',
          activeModal: null
        });
      }
    };

    // Initial render on load
    document.addEventListener('DOMContentLoaded', render);
    render();
  })();
  </script>
</body>
</html>
